name: v2 release validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: v2-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    name: Linux full release validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Validate v2 release
        run: npm run validate:release

      - name: Platform smoke
        run: npm run smoke:platform

  platform-smoke:
    name: ${{ matrix.os }} smoke
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify v2 release contract
        run: npm run verify:release

      - name: Verify clean npm installation
        run: npm run verify:install

      - name: Run real environment and media smoke
        run: npm run smoke:release

      - name: Platform smoke
        run: npm run smoke:platform
